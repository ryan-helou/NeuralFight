[project]
name = "neuralfight-server"
version = "0.1.0"
description = "NeuralFight API and ML prediction engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "optuna>=4.0",
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
